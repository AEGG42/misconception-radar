<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Misconception Radar architecture overlay</title>
  <desc id="desc">Four reliability layers: expert taxonomy, structured DeepSeek output, deterministic checks, and browser-only names.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14201f"/>
      <stop offset="1" stop-color="#1c3144"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="170" cy="130" r="54" fill="#d7fa62"/>
  <circle cx="170" cy="130" r="35" fill="none" stroke="#14201f" stroke-width="3"/>
  <circle cx="170" cy="130" r="18" fill="none" stroke="#14201f" stroke-width="3"/>
  <circle cx="170" cy="130" r="5" fill="#14201f"/>
  <text x="250" y="118" fill="#fffdf7" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Misconception Radar</text>
  <text x="250" y="158" fill="#aebbb7" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">RELIABILITY BY DESIGN</text>
  <text x="120" y="300" fill="#fffdf7" font-family="Georgia, serif" font-size="78">A useful draft needs</text>
  <text x="120" y="386" fill="#d7fa62" font-family="Georgia, serif" font-size="78" font-style="italic">visible guardrails.</text>
  <g filter="url(#shadow)">
    <g transform="translate(120 490)">
      <rect width="390" height="300" rx="30" fill="#fffdf7"/>
      <circle cx="58" cy="62" r="24" fill="#f26b4f"/>
      <text x="52" y="70" fill="#fff" font-family="Inter, Arial" font-size="22" font-weight="800">1</text>
      <text x="36" y="130" fill="#14201f" font-family="Inter, Arial" font-size="28" font-weight="800">Expert taxonomy</text>
      <text x="36" y="180" fill="#59635f" font-family="Inter, Arial" font-size="20">Bounded, teacher-reviewed</text>
      <text x="36" y="212" fill="#59635f" font-family="Inter, Arial" font-size="20">physics misconceptions.</text>
    </g>
    <g transform="translate(550 490)">
      <rect width="390" height="300" rx="30" fill="#fffdf7"/>
      <circle cx="58" cy="62" r="24" fill="#8c6de9"/>
      <text x="52" y="70" fill="#fff" font-family="Inter, Arial" font-size="22" font-weight="800">2</text>
      <text x="36" y="130" fill="#14201f" font-family="Inter, Arial" font-size="28" font-weight="800">Structured AI</text>
      <text x="36" y="180" fill="#59635f" font-family="Inter, Arial" font-size="20">DeepSeek JSON output</text>
      <text x="36" y="212" fill="#59635f" font-family="Inter, Arial" font-size="20">validated with Zod.</text>
    </g>
    <g transform="translate(980 490)">
      <rect width="390" height="300" rx="30" fill="#fffdf7"/>
      <circle cx="58" cy="62" r="24" fill="#4e89e8"/>
      <text x="52" y="70" fill="#fff" font-family="Inter, Arial" font-size="22" font-weight="800">3</text>
      <text x="36" y="130" fill="#14201f" font-family="Inter, Arial" font-size="28" font-weight="800">Evidence checks</text>
      <text x="36" y="180" fill="#59635f" font-family="Inter, Arial" font-size="20">IDs, scores, counts, and</text>
      <text x="36" y="212" fill="#59635f" font-family="Inter, Arial" font-size="20">quotes verified in code.</text>
    </g>
    <g transform="translate(1410 490)">
      <rect width="390" height="300" rx="30" fill="#fffdf7"/>
      <circle cx="58" cy="62" r="24" fill="#2f9e8f"/>
      <text x="52" y="70" fill="#fff" font-family="Inter, Arial" font-size="22" font-weight="800">4</text>
      <text x="36" y="130" fill="#14201f" font-family="Inter, Arial" font-size="28" font-weight="800">Privacy boundary</text>
      <text x="36" y="180" fill="#59635f" font-family="Inter, Arial" font-size="20">Names stay in the browser.</text>
      <text x="36" y="212" fill="#59635f" font-family="Inter, Arial" font-size="20">No response database.</text>
    </g>
  </g>
  <text x="120" y="942" fill="#fffdf7" font-family="Inter, Arial" font-size="28" font-weight="700">AI drafts the diagnosis. The teacher keeps the decision.</text>
</svg>
